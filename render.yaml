databases:
  - name: asbl_db
    databaseName: asbl_db
    user: asbl_admin
    # Don't include password here - Render will generate it

services:
  - type: web
    name: asbl-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asbl_db  # This must match the database name above
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: DJANGO_SETTINGS_MODULE
        value: settings